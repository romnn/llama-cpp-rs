[package]
name = "llama-cpp-sys-2"
description = "Low Level Bindings to llama.cpp"
version = "0.1.152"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/utilityai/llama-cpp-rs"
links = "llama"

include = [
    "wrapper.h",
    "wrapper_common.h",
    "wrapper_common.cpp",
    "wrapper_oai.h",
    "wrapper_oai.cpp",
    "wrapper_utils.h",
    "wrapper_mtmd.h",
    "build.rs",
    "/src",

    "/llama.cpp/common/**/*.h",
    "/llama.cpp/common/**/*.hpp",
    "/llama.cpp/common/**/*.cpp",
    "/llama.cpp/ggml/include/*.h",
    "/llama.cpp/ggml/src/*.h",
    "/llama.cpp/ggml/src/*.c",
    "/llama.cpp/ggml/src/*.cpp",
    "/llama.cpp/src/*.h",
    "/llama.cpp/src/*.cpp",
    "/llama.cpp/src/models/*.h",
    "/llama.cpp/src/models/*.cpp",
    "/llama.cpp/tools/mtmd/*.h",
    "/llama.cpp/tools/mtmd/*.cpp",
    "/llama.cpp/tools/mtmd/models/*.h",
    "/llama.cpp/tools/mtmd/models/*.cpp",
    "/llama.cpp/tools/mtmd/debug/*.h",
    "/llama.cpp/tools/mtmd/debug/*.cpp",

    "/llama.cpp/convert_hf_to_gguf.py", # Yes, it's required
    "/llama.cpp/common/build-info.cpp.in",

    "/llama.cpp/ggml/src/ggml-cuda.cu",
    "/llama.cpp/ggml/src/ggml-metal.m",
    "/llama.cpp/ggml/src/ggml-metal.metal",

    "/llama.cpp/include/llama.h",
    "/llama.cpp/include/llama-cpp.h",

    "/llama.cpp/ggml/src/ggml-cpu/**/*",
    "/llama.cpp/ggml/src/ggml-cuda/**/*",
    "/llama.cpp/ggml/src/ggml-metal/**/*",
    "/llama.cpp/ggml/src/ggml-vulkan/**/*",
    "/llama.cpp/ggml/src/ggml-opencl/**/*",
    "/llama.cpp/ggml/src/ggml-hip/**/*",

    "/llama.cpp/ggml/src/llamafile/sgemm.h",
    "/llama.cpp/ggml/src/llamafile/sgemm.cpp",

    "/llama.cpp/pocs",
    "/llama.cpp/vendor",

    "/llama.cpp/CMakeLists.txt",
    "/llama.cpp/common/CMakeLists.txt",
    "/llama.cpp/ggml/CMakeLists.txt",
    "/llama.cpp/ggml/src/CMakeLists.txt",
    "/llama.cpp/src/CMakeLists.txt",

    "/llama.cpp/cmake",
    "/llama.cpp/ggml/cmake",
    "/llama.cpp/common/cmake",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Optional shared-ggml backend. Activated by the `system-ggml` feature.
# When enabled, our `build.rs` reads the install path from `DEP_GGML_CMAKE_PREFIX_PATH`
# and passes it to CMake as `CMAKE_PREFIX_PATH`, so llama.cpp's own
# `find_package(ggml REQUIRED)` (triggered by `LLAMA_USE_SYSTEM_GGML=ON`)
# resolves against the externally-built ggml instead of the bundled copy.
ggml-sys = { version = "*", optional = true }

[build-dependencies]
bindgen = { workspace = true }
cc = { workspace = true, features = ["parallel"] }
cmake = "0.1"
find_cuda_helper = "0.2.0"
glob = "0.3.3"
walkdir = "2"

[features]
default = ["common"]
# Build the high-level OpenAI-compatible / chat-template / JSON-schema-to-grammar
# helpers backed by llama.cpp's `common/` static library. Disabling this drops
# `libcommon.a` (~14 MB) and the `wrapper_common.cpp` / `wrapper_oai.cpp`
# bindings (~10 MB combined static archive) from the link line, which matters
# for size-constrained downstream binaries that only need the core inference
# API. Enabled by default to preserve backwards compatibility.
common = []
# Backend selection. When `system-ggml` is also enabled, each backend feature
# is propagated into ggml-sys via `ggml-sys?/<backend>` (`?` only activates the
# feature if ggml-sys is already in the dep graph). This guarantees the
# externally-built libggml has matching backend symbols.
cuda = ["ggml-sys?/cuda"]
# Disables the need to dynamically link against libcuda.so / cuda.dll
cuda-no-vmm = ["cuda"]
metal = ["ggml-sys?/metal"]
dynamic-link = []
vulkan = ["ggml-sys?/vulkan"]
# OpenCL backend (GGML_OPENCL=ON) — the Qualcomm-supported path for Adreno GPUs.
# The build needs OpenCL headers + a libOpenCL.so to link; on a cross-compile
# (e.g. Android) point CMake at them via the OPENCL_INCLUDE_DIR / OPENCL_LIBRARY
# env vars (build.rs forwards them), since FindOpenCL can't locate an SDK.
opencl = []
# Build the BLAS backend with Intel MKL (x86_64-only; requires MKLROOT set).
mkl = []
openmp = ["ggml-sys?/openmp"]
# Link GNU OpenMP (`libgomp`) statically on GNU targets. This is useful for
# downstreams that ship self-contained binaries while keeping OpenMP enabled.
static-openmp = ["openmp"]
rocm = ["ggml-sys?/hipblas"]
# Link the C++ standard library statically where the target toolchain supports
# it. Currently used by Android and Linux GNU/musl targets.
static-stdcxx = []
shared-stdcxx = []
system-ggml = ["dep:ggml-sys"]
system-ggml-static = ["system-ggml"]
mtmd = []
dynamic-backends = ["dynamic-link"]
